name: xinbox
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${XINBOX_BIND:-127.0.0.1}:${XINBOX_PORT:-8787}:8787"
    environment:
      SMS_DATA_DIR: /data
      SMS_STATIC_DIR: /app/static
      SMS_SECURE_COOKIE: "${XINBOX_SECURE_COOKIE:-false}"
    volumes:
      - xinbox_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 384m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  xinbox_data:
