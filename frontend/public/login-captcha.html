<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="data-spm" />
<script>
      window.AliyunCaptchaConfig = {
        // 必填，验证码示例所属地区，支持中国内地（cn）、新加坡（sgp）
        region: 'cn',
        // 必填，身份标。开通阿里云验证码2.0后，您可以在控制台概览页面的实例基本信息卡片区域，获取身份标
        prefix: 'ojkh9h'
      }
    </script>
<script type="text/javascript" src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
<style>
      * {
        margin: 0;
        padding: 0;
        font-size: 32px;
      }
      input,
      button {
        outline: none;
      }

      body,
      input,
      select,
      textarea,
      button,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: PingFang SC, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu',
          'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-weight: normal;
        font-size: 48px;
      }
      #aliyunCaptcha-sliding-element {
        margin-top: 40px;
      }
      #aliyunCaptcha-btn-close {
        font-size: 32px !important;
      }
      #aliyunCaptcha-title {
        font-size: 48px;
        margin-left: 20px;
      }
      .aliyunCaptcha-top {
        margin-top: 60px;
      }
      #aliyunCaptcha-option {
        display: none;
        opacity: 0;
      }
      #aliyunCaptcha-sliding-wrapper #aliyunCaptcha-sliding-body #aliyunCaptcha-sliding-slider {
        font-size: 32px !important;
      }
      #button {
        border: 1px solid #9999;
        background: #fff;
        margin: 10px;
        padding: 4px 10px;
        border-radius: 5px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* 替换原有的 .loading 样式 */
      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 20px;
        display: flex;
        justify-content: space-between;
        z-index: 9999;
      }

      .loading-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #d63c83;
        animation: bounce 1.4s infinite ease-in-out;
      }

      .loading-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .loading-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
    </style>
</head>
<body>
<div class="loading">
<div class="loading-dot"></div>
<div class="loading-dot"></div>
<div class="loading-dot"></div>
</div>
<div id="captcha-element"></div>
<button id="button" class="btn" hidden>
重新初始化验证码
</button>
<script type="text/javascript">
      function initCaptcha(rem) {
        // 弹出式，除region和prefix以外的参数
        window.initAliyunCaptcha({
          // 场景ID。根据步骤二新建验证场景后，您可以在验证码场景列表，获取该场景的场景ID
          SceneId: 'vq25q9sr',
          // 验证码模式，popup表示弹出式，embed表示嵌入式。无需修改
          mode: 'popup',
          // 页面上预留的渲染验证码的元素，与原代码中预留的页面元素保持一致。
          element: '#captcha-element',
          // 触发验证码弹窗或无痕验证的元素
          button: '#button',
          // 验证码验证通过回调函数
          success: function (captchaVerifyParam) {
            
            // 入参为验签captchaVerifyParam
            // 1.向后端发起业务请求进行验证码验签captchaVerifyParam校验
            // 2.根据校验结果来进行业务处理
            // 3.如业务需要重新进行验证码验证，调用验证码初始化方法initAliyunCaptcha重新初始化验证码
            parent.postMessage({type:'jego-captcha-result',nonce:'__WINDOW_NONCE__',value:captchaVerifyParam}, '*')
          },
          // 验证码验证不通过回调函数
          fail: function (result) {
            // 入参为不通过信息
            // 正常验证有效期内不需要做任何操作，验证码自动刷新，重新进行验证
            console.error(result)
          },
          // 绑定验证码实例回调函数，该回调会在验证码初始化成功后调用
          getInstance: function (instance) {
            instance.show()
          },
          // 滑块验证和一点即过的验证形态触发框体样式，支持自定义宽度和高度，单位为px。
          slideStyle: {
            width: window.innerWidth,
            height: 120
          }
          // ...其他参数，参考initAliyunCaptcha参数说明
        })
      }
      initCaptcha()
    </script>
</body>
</html>
